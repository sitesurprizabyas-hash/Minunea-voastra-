<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pentru tine — Mesaje</title>

    <!-- FONTURI -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <!-- CSS-UL NOSTRU -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="video-page">


    <!-- =====================================
         INTRODUCERE
    ====================================== -->

    <section class="video-intro">

        <p class="section-eyebrow">
            PENTRU TINE
        </p>

        <h1>
            Câteva mesaje<br>
            din suflet.
        </h1>

        <p class="video-intro-text">
            Dă play atunci când ești pregătită.
        </p>

        <div class="scroll-video">
            ↓
        </div>

    </section>



    <!-- =====================================
         VIDEO 01
    ====================================== -->

    <section class="video-message">

        <p class="video-number">
            01
        </p>

        <h2>
            Un mesaj pentru tine
        </h2>

        <div class="video-frame">

            <video
                controls
                playsinline
                preload="metadata"
            >
                <source
                    src="videos/video1.mp4"
                    type="video/mp4"
                >

                Browserul tău nu poate reda
                acest videoclip.
            </video>

        </div>

    </section>



    <!-- =====================================
         VIDEO 02
    ====================================== -->

    <section class="video-message">

        <p class="video-number">
            02
        </p>

        <h2>
            Mai este cineva care
            vrea să-ți spună ceva...
        </h2>

        <div class="video-frame">

            <video
                controls
                playsinline
                preload="metadata"
            >
                <source
                    src="videos/video2.mp4"
                    type="video/mp4"
                >

                Browserul tău nu poate reda
                acest videoclip.
            </video>

        </div>

    </section>



    <!-- =====================================
         VIDEO 03
    ====================================== -->

    <section class="video-message">

        <p class="video-number">
            03
        </p>

        <h2>
            Și încă un gând,
            cu mult drag.
        </h2>

        <div class="video-frame">

            <video
                controls
                playsinline
                preload="metadata"
            >
                <source
                    src="videos/video3.mp4"
                    type="video/mp4"
                >

                Browserul tău nu poate reda
                acest videoclip.
            </video>

        </div>

    </section>



    <!-- =====================================
         FINAL
    ====================================== -->

    <section class="video-ending">

        <p class="section-eyebrow">
            ȘI TOTUȘI...
        </p>

        <h2>
            povestea nu se termină aici.
        </h2>

        <p>
            Mai avem un ultim lucru
            să-ți spunem.
        </p>

        <a
            href="index.html#final"
            class="back-story"
        >
            Continuă povestea
            <span>→</span>
        </a>

    </section>


    <!-- JS DOAR PENTRU VIDEO -->
    <script src="video.js"></script>

</body>

</html>
